<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6 ශ්‍රේණිය ICT - බැලුම් සටන</title>
    <style>
        :root {
            --title-font: clamp(1.4rem, 3.5vw, 2.2rem);
            --subtitle-font: clamp(1rem, 2.5vw, 1.5rem);
            --normal-font: clamp(0.9rem, 2vw, 1.2rem);
            --emoji-font: clamp(2.5rem, 6vw, 3.5rem);
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E3F2FD;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            overflow: hidden; 
            
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none; 
        }
        
        header {
            background-color: #1976D2;
            color: white;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 10;
        }
        h1 { margin: 0; font-size: var(--title-font); }
        h2.sub-title { margin: 5px 0 0 0; font-size: var(--normal-font); color: #BBDEFB; }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 95%;
            margin: 10px 0;
            font-weight: bold;
            z-index: 10;
        }
        .team {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 48%; 
            font-size: var(--normal-font);
        }
        .team-a { border-bottom: 5px solid #2196F3; }
        .team-b { border-bottom: 5px solid #f44336; }

        .score-val {
            font-size: var(--subtitle-font);
            display: block;
            margin-top: 5px;
        }

        #gameArea {
            position: relative;
            width: 100%;
            height: calc(100vh - 150px); 
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            overflow: hidden;
            border-top: 4px solid white;
            transition: border-color 0.3s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake-effect {
            animation: shake 0.3s ease-in-out;
            border-top: 4px solid #f44336 !important;
            background-color: #ffcdd2 !important;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: clamp(65px, 13vw, 95px);
            height: clamp(85px, 16vw, 120px);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--emoji-font); 
            cursor: pointer;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.2);
            animation: floatUp linear forwards;
            transition: transform 0.1s;
        }
        
        .balloon::after {
            content: "▲";
            position: absolute;
            bottom: -10px;
            font-size: 0.5em;
            color: inherit;
        }
        .balloon:active { transform: scale(0.85); }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-50vh) rotate(5deg); }
            100% { transform: translateY(-120vh) rotate(-5deg); }
        }

        @keyframes floatScore {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }
        .floating-score {
            position: absolute;
            font-size: var(--subtitle-font);
            font-weight: bold;
            z-index: 15;
            pointer-events: none;
            animation: floatScore 0.8s ease-out forwards;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 15px;
        }
        
        .overlay h2 { font-size: var(--title-font); margin-bottom: 10px; }
        .overlay p { font-size: var(--normal-font); line-height: 1.5; margin: 10px 0; }

        .btn {
            background-color: #FF9800;
            color: white;
            font-size: var(--subtitle-font);
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .btn:hover { background-color: #F57C00; transform: scale(1.05); }

        #timerDisplay {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: var(--subtitle-font);
            font-weight: bold;
            color: #D32F2F;
            background: white;
            padding: 6px 15px;
            border-radius: 8px;
            z-index: 10;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
        
        #instructionDisplay {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: var(--normal-font);
            font-weight: bold;
            color: white;
            background: #2196F3;
            padding: 6px 15px;
            border-radius: 8px;
            z-index: 10;
            max-width: 60%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>💻 ICT උපාංග හඳුනාගනිමු 💻</h1>
        <h2 class="sub-title">6 ශ්‍රේණිය - බැලුම් පිපිරවීමේ ක්‍රීඩාව</h2>
    </header>

    <div class="scoreboard">
        <div class="team team-a">Group A <br><span id="scoreA" class="score-val" style="color: #2196F3;">0</span></div>
        <div class="team team-b">Group B <br><span id="scoreB" class="score-val" style="color: #f44336;">0</span></div>
    </div>

    <div id="gameArea">
        <div id="timerDisplay" class="hidden">⏳ 20s</div>
        <div id="instructionDisplay" class="hidden">ඉලක්කය මෙහි පෙන්වයි</div>

        <div id="startScreen" class="overlay">
            <h2 style="color: #1976D2;">ICT බැලුම් සටන!</h2>
            <p>තිරයේ දිස්වන ඉලක්කයට අදාල පරිගණක උපාංගය සහිත බැලුම පමණක් Touch කර පුපුරවන්න.<br><br><span style="color:#4CAF50; font-weight:bold;">✅ නිවැරදි නම් +10</span><br><span style="color:#f44336; font-weight:bold;">❌ වැරදි නම් -5</span></p>
            <button class="btn" onclick="startNextRound()">▶ තරගය අරඹන්න</button>
        </div>

        <div id="roundScreen" class="overlay hidden">
            <h2 id="roundTeam"></h2>
            <h1 id="roundTask" style="font-size: var(--title-font); color: #D84315; margin: 15px 0;"></h1>
            <button class="btn" onclick="startAction()">🚀 Ready!</button>
        </div>

        <div id="endScreen" class="overlay hidden">
            <h2 style="color: #4CAF50;">තරගය අවසන්! 🎉</h2>
            <h3 id="winnerText" style="font-size: var(--title-font); margin: 15px 0;"></h3>
            <button class="btn" onclick="location.reload()">නැවත ආරම්භ කරන්න</button>
        </div>
    </div>

    <script>
        // --- Security Measures (Copy/Inspect වැළැක්වීම) ---
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) e.preventDefault();
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) e.preventDefault();
        });
        setInterval(function() {
            const before = new Date().getTime();
            debugger; 
            if (new Date().getTime() - before > 100) { 
                document.body.innerHTML = "<h1 style='text-align:center; color:red; margin-top:20vh; font-size:2rem;'>Developer Tools වසා දමන්න!</h1>"; 
            }
        }, 1000);

        // --- Audio System (Offline Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'pop') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.2);
            }
        }

        // --- ICT විෂයට අදාල වටයන් (Rounds Data for Grade 6 ICT) ---
        const roundsData = [
            { team: 'A', taskName: "ආදාන උපාංග\n(Input Devices)", targets: ['🖱️', '⌨️', '🎤', '🎮', '📷', '🕹️'], decoys: ['🖨️', '🖥️', '🔊', '💾', '📱'] },
            { team: 'B', taskName: "ප්‍රතිදාන උපාංග\n(Output Devices)", targets: ['🖨️', '🖥️', '🔊', '🎧', '📽️'], decoys: ['🖱️', '⌨️', '🎮', '💾', '📱'] },
            { team: 'A', taskName: "ආචයන උපාංග\n(Storage Devices)", targets: ['💾', '💿', '📀', '💽'], decoys: ['🖱️', '🖨️', '🔊', '📱', '📡'] },
            { team: 'B', taskName: "සන්නිවේදන උපාංග\n(Comm. Devices)", targets: ['📱', '☎️', '📡', '🛰️', '📠'], decoys: ['🖱️', '🖥️', '🖨️', '💾', '🎮'] },
            { team: 'A', taskName: "ආදාන උපාංග පමණක්\n(Only Input)", targets: ['🖱️', '⌨️', '🎤'], decoys: ['🖨️️', '🖥️', '🔊', '🎧'] },
            { team: 'B', taskName: "ආචයන උපාංග පමණක්\n(Only Storage)", targets: ['💾', '💿', '📀'], decoys: ['📱', '☎️', '📡', '🖥️'] }
        ];

        let currentRound = 0;
        let scoreA = 0;
        let scoreB = 0;
        let timeLeft = 20; 
        let gameTimer, spawnTimer;

        // ICT theme colors for balloons
        const colors = ['#FF5252', '#E040FB', '#536DFE', '#40C4FF', '#18FFFF', '#69F0AE', '#B2FF59', '#FFD740', '#FFAB40', '#FF6E40'];
        const gameArea = document.getElementById('gameArea');

        function startNextRound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if (currentRound >= roundsData.length) {
                showEndScreen(); return;
            }

            document.getElementById('startScreen').classList.add('hidden');
            gameArea.querySelectorAll('.balloon').forEach(b => b.remove());

            const round = roundsData[currentRound];
            const roundTeam = document.getElementById('roundTeam');
            roundTeam.innerText = `🎯 දැන් වාරය: Group ${round.team}`;
            roundTeam.style.color = round.team === 'A' ? '#2196F3' : '#f44336';
            document.getElementById('roundTask').innerText = `සොයන්න:\n${round.taskName}`;
            
            document.getElementById('roundScreen').classList.remove('hidden');
            document.getElementById('timerDisplay').classList.add('hidden');
            document.getElementById('instructionDisplay').classList.add('hidden');
        }

        function startAction() {
            document.getElementById('roundScreen').classList.add('hidden');
            document.getElementById('timerDisplay').classList.remove('hidden');
            document.getElementById('instructionDisplay').classList.remove('hidden');
            
            const round = roundsData[currentRound];
            const instDisplay = document.getElementById('instructionDisplay');
            instDisplay.innerText = round.taskName;
            instDisplay.style.backgroundColor = round.team === 'A' ? '#2196F3' : '#f44336';

            timeLeft = 20;
            document.getElementById('timerDisplay').innerText = `⏳ ${timeLeft}s`;

            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = `⏳ ${timeLeft}s`;
                if (timeLeft <= 0) endAction();
            }, 1000);

            spawnTimer = setInterval(() => spawnBalloon(round), 850);
        }

        function spawnBalloon(round) {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            
            const bgColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.backgroundColor = bgColor;
            balloon.style.color = bgColor; 
            balloon.style.left = Math.floor(Math.random() * 75) + 5 + '%'; 
            
            const speed = Math.random() * 3 + 4; 
            balloon.style.animationDuration = `${speed}s`;

            const isTarget = Math.random() > 0.5;
            const iconList = isTarget ? round.targets : round.decoys;
            balloon.innerText = iconList[Math.floor(Math.random() * iconList.length)];
            
            balloon.onpointerdown = function(e) {
                e.preventDefault(); 
                const rect = balloon.getBoundingClientRect();
                const gameAreaRect = gameArea.getBoundingClientRect();
                const x = rect.left - gameAreaRect.left + (rect.width/2);
                const y = rect.top - gameAreaRect.top + (rect.height/2);

                if(isTarget) {
                    playSound('pop');
                    updateScore(round.team, 10);
                    showFloatingScore(x, y, '+10', '#4CAF50');
                    createExplosion(x, y, '💥');
                } else {
                    playSound('error');
                    updateScore(round.team, -5);
                    showFloatingScore(x, y, '-5', '#f44336');
                    createExplosion(x, y, '❌');
                    triggerShake();
                }
                balloon.remove(); 
            };

            gameArea.appendChild(balloon);
            setTimeout(() => { if (balloon.parentElement) balloon.remove(); }, speed * 1000);
        }

        function showFloatingScore(x, y, text, color) {
            const floatScore = document.createElement('div');
            floatScore.classList.add('floating-score');
            floatScore.innerText = text;
            floatScore.style.color = color;
            floatScore.style.left = `${x - 15}px`;
            floatScore.style.top = `${y - 15}px`;
            
            gameArea.appendChild(floatScore);
            setTimeout(() => floatScore.remove(), 800);
        }

        function createExplosion(x, y, symbol) {
            const exp = document.createElement('div');
            exp.innerText = symbol;
            exp.style.position = 'absolute';
            exp.style.left = `${x - 20}px`;
            exp.style.top = `${y - 20}px`;
            exp.style.fontSize = 'var(--emoji-font)';
            exp.style.zIndex = 5;
            gameArea.appendChild(exp);

            setTimeout(() => exp.remove(), 300);
        }

        function triggerShake() {
            gameArea.classList.add('shake-effect');
            setTimeout(() => gameArea.classList.remove('shake-effect'), 300);
        }

        function updateScore(team, points) {
            if (team === 'A') {
                scoreA += points;
                document.getElementById('scoreA').innerText = scoreA;
            } else {
                scoreB += points;
                document.getElementById('scoreB').innerText = scoreB;
            }
        }

        function endAction() {
            clearInterval(gameTimer);
            clearInterval(spawnTimer);
            currentRound++;
            setTimeout(() => startNextRound(), 1000); 
        }

        function showEndScreen() {
            document.getElementById('endScreen').classList.remove('hidden');
            document.getElementById('timerDisplay').classList.add('hidden');
            document.getElementById('instructionDisplay').classList.add('hidden');
            
            const winnerText = document.getElementById("winnerText");
            if (scoreA > scoreB) {
                winnerText.innerText = "🏆 Group A දිනුම්!";
                winnerText.style.color = "#2196F3";
            } else if (scoreB > scoreA) {
                winnerText.innerText = "🏆 Group B දිනුම්!";
                winnerText.style.color = "#f44336";
            } else {
                winnerText.innerText = "🤝 තරගය සමයි!";
                winnerText.style.color = "#FF9800";
            }
        }
    </script>
</body>
</html>

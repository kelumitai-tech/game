<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 ශ්‍රේණිය - Group A vs Group B තරගය</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
            
            /* Text Select කිරීම සහ Copy කිරීම වැළැක්වීම */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        header {
            background-color: #673AB7;
            color: white;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; font-size: 2.2em; }
        
        /* Start Screen Styles */
        #startScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
        }
        .start-btn {
            background-color: #4CAF50;
            color: white;
            font-size: 2em;
            padding: 20px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
            font-weight: bold;
            margin-top: 20px;
        }
        .start-btn:hover { background-color: #388E3C; transform: scale(1.05); }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 80%;
            margin: 20px 0;
            font-size: 1.5em;
            font-weight: bold;
        }
        .team {
            background: white;
            padding: 15px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 30%;
        }
        .team-a { border-bottom: 6px solid #2196F3; }
        .team-b { border-bottom: 6px solid #f44336; }
        
        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 80%;
            max-width: 800px;
            margin-bottom: 15px;
        }

        #turnIndicator {
            font-size: 1.4em;
            font-weight: bold;
            padding: 10px 25px;
            border-radius: 20px;
            color: white;
        }
        .turn-a { background-color: #2196F3; }
        .turn-b { background-color: #f44336; }

        #timerContainer {
            font-size: 1.5em;
            font-weight: bold;
            background-color: #ffebee;
            color: #D32F2F;
            border: 3px solid #f44336;
            padding: 10px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 150px;
            text-align: center;
        }

        .game-container {
            background: white;
            width: 80%;
            max-width: 800px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        .question {
            font-size: 1.6em;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: bold;
        }
        
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .option-btn {
            background-color: #e7e7e7;
            border: 2px solid #ccc;
            padding: 15px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            user-select: none; 
        }
        
        .option-btn:hover { background-color: #d4d4d4; }
        .correct { background-color: #4CAF50 !important; color: white; border-color: #388E3C; }
        .wrong { background-color: #f44336 !important; color: white; border-color: #D32F2F; }
        .disabled { pointer-events: none; opacity: 0.8; } 
        
        .btn-next {
            background-color: #FF9800;
            padding: 12px 25px;
            font-size: 1.2em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>🌟 6 ශ්‍රේණිය - කණ්ඩායම් දැනුම මිනුම 🌟</h1>
    </header>

    <!-- ආරම්භක තිරය (Start Screen) -->
    <div id="startScreen">
        <h2 style="font-size: 2em; color: #2c3e50;">සියල්ල සූදානම් ද?</h2>
        <p style="font-size: 1.2em;">ප්‍රශ්න 10ක් ඇත. පිළිතුරු දීමට තත්පර 30ක කාලයක් ලැබේ.</p>
        <button class="start-btn" onclick="startGame()">▶ තරගය ආරම්භ කරන්න</button>
    </div>

    <!-- ක්‍රීඩාවේ ප්‍රධාන කොටස් -->
    <div class="scoreboard hidden" id="scoreboard">
        <div class="team team-a">Group A ලකුණු: <br><span id="scoreA" style="font-size: 1.5em; color: #2196F3;">0</span></div>
        <div class="team team-b">Group B ලකුණු: <br><span id="scoreB" style="font-size: 1.5em; color: #f44336;">0</span></div>
    </div>

    <div class="status-container hidden" id="statusArea">
        <div id="turnIndicator" class="turn-a">🎯 දැන් වාරය: Group A</div>
        <div id="timerContainer">⏳ කාලය: 30s</div>
    </div>

    <div class="game-container hidden" id="gameArea">
        <div class="question" id="questionText">ප්‍රශ්නය මෙහි දිස්වනු ඇත...</div>
        <div class="options" id="optionsContainer"></div>
        <button class="btn-next hidden" id="nextBtn" onclick="nextQuestion()">ඊළඟ ප්‍රශ්නය ➔</button>
    </div>

    <!-- අවසාන තිරය -->
    <div class="game-container hidden" id="endScreen">
        <h2 style="font-size: 2.5em; color: #4CAF50;">තරගය අවසන්! 🎉</h2>
        <h3 id="winnerText" style="font-size: 2em;"></h3>
        <button class="btn-next" onclick="location.reload()">නැවත ආරම්භ කරන්න</button>
    </div>

    <script>
        // --- Right-click සහ Shortcuts අක්‍රිය කිරීම පමණක් --- //
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) e.preventDefault();
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) e.preventDefault();
        });
        // ---------------------------------------------------- //

        const quizData = [
            { question: "1. (ICT) පරිගණකයක ආදාන උපාංගයක් (Input Device) වන්නේ පහතින් කුමක්ද?", options: ["මොනිටරය", "මුද්‍රණ යන්ත්‍රය", "මූසිකය (Mouse)", "ස්පීකරය"], correctAnswer: 2 },
            { question: "2. (විද්‍යාව) ශාක වලට ආහාර නිපදවීම සඳහා අවශ්‍ය වන ප්‍රධාන ශක්ති ප්‍රභවය කුමක්ද?", options: ["චන්ද්‍රයා", "සූර්යයා", "විදුලිය", "සුළඟ"], correctAnswer: 1 },
            { question: "3. (විද්‍යාව) මිනිස් සිරුර පුරා රුධිරය පොම්ප කිරීමේ කාර්යය කරන අවයවය කුමක්ද?", options: ["පෙනහළු", "වකුගඩු", "මොළය", "හෘදය"], correctAnswer: 3 },
            { question: "4. (සාමාන්‍ය දැනීම) ශ්‍රී ලංකාවේ ජාතික වෘක්ෂය කුමක්ද?", options: ["නා ගස", "පොල් ගස", "බෝ ගස", "අඹ ගස"], correctAnswer: 0 },
            { question: "5. (ගණිතය) 125 සහ 45 හි එකතුව (125 + 45) කීයද?", options: ["160", "170", "180", "150"], correctAnswer: 1 },
            { question: "6. (ICT) 'පරිගණකයේ මොළය' ලෙස හඳුන්වන්නේ පහත සඳහන් කුමක්ද?", options: ["RAM එක", "මව් පුවරුව (Motherboard)", "මධ්‍ය සැකසුම් ඒකකය (CPU)", "දෘඪ තැටිය (Hard Disk)"], correctAnswer: 2 },
            { question: "7. (ගණිතය) රුපියල් 500කින් රුපියල් 230ක් වියදම් කළ විට ඉතිරිය කීයද?", options: ["රු. 170", "රු. 270", "රු. 370", "රු. 230"], correctAnswer: 1 },
            { question: "8. (විද්‍යාව) ජලයේ දියවන විටමින් වර්ගයක් වන්නේ මින් කුමක්ද?", options: ["විටමින් A", "විටමින් C", "විටමින් D", "විටමින් K"], correctAnswer: 1 },
            { question: "9. (සාමාන්‍ය දැනීම) ශ්‍රී ලංකාවේ උසම කන්ද කුමක්ද?", options: ["ශ්‍රී පාදය", "පිදුරුතලාගල", "නමුණුකුල", "හග්ගල"], correctAnswer: 1 },
            { question: "10. (ICT) පරිගණකයක තාවකාලික මතකය (Temporary Memory) කුමක්ද?", options: ["ROM", "Hard Disk (දෘඪ තැටිය)", "RAM", "Pen Drive"], correctAnswer: 2 }
        ];

        let currentQuestionIndex = 0;
        let scoreA = 0;
        let scoreB = 0;
        let currentTeam = 'A';
        let answerRevealed = false;
        
        let timeLeft = 30;
        let timerInterval;

        const startScreen = document.getElementById("startScreen");
        const scoreboard = document.getElementById("scoreboard");
        const statusArea = document.getElementById("statusArea");
        const gameArea = document.getElementById("gameArea");
        
        const questionText = document.getElementById("questionText");
        const optionsContainer = document.getElementById("optionsContainer");
        const scoreADisplay = document.getElementById("scoreA");
        const scoreBDisplay = document.getElementById("scoreB");
        const endScreen = document.getElementById("endScreen");
        const winnerText = document.getElementById("winnerText");
        const turnIndicator = document.getElementById("turnIndicator");
        const nextBtn = document.getElementById("nextBtn");
        const timerContainer = document.getElementById("timerContainer");

        function startGame() {
            startScreen.classList.add("hidden");
            scoreboard.classList.remove("hidden");
            statusArea.classList.remove("hidden");
            gameArea.classList.remove("hidden");
            
            loadQuestion();
        }

        function startTimer() {
            clearInterval(timerInterval); 
            timeLeft = 30; 
            timerContainer.innerText = "⏳ කාලය: " + timeLeft + "s"; 
            timerContainer.style.color = "#D32F2F"; 

            timerInterval = setInterval(() => {
                timeLeft--;
                timerContainer.innerText = "⏳ කාලය: " + timeLeft + "s";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 1000); 
        }

        function handleTimeOut() {
            if (answerRevealed) return;
            answerRevealed = true;
            
            timerContainer.innerText = "⏳ කාලය අවසන්!";
            
            const correctIndex = quizData[currentQuestionIndex].correctAnswer;
            const allBtns = optionsContainer.children;

            allBtns[correctIndex].classList.add("correct");
            
            for (let btn of allBtns) {
                btn.classList.add("disabled");
            }

            nextBtn.classList.remove("hidden"); 
        }

        function loadQuestion() {
            answerRevealed = false;
            nextBtn.classList.add("hidden"); 
            
            currentTeam = (currentQuestionIndex % 2 === 0) ? 'A' : 'B';
            
            if(currentTeam === 'A') {
                turnIndicator.innerText = "🎯 දැන් වාරය: Group A";
                turnIndicator.className = "turn-a";
            } else {
                turnIndicator.innerText = "🎯 දැන් වාරය: Group B";
                turnIndicator.className = "turn-b";
            }

            const currentData = quizData[currentQuestionIndex];
            questionText.innerText = currentData.question;
            optionsContainer.innerHTML = "";

            currentData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.innerText = option;
                btn.classList.add("option-btn");
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (answerRevealed) return; 
            
            clearInterval(timerInterval); 
            
            const correctIndex = quizData[currentQuestionIndex].correctAnswer;
            const allBtns = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add("correct");
                if(currentTeam === 'A') {
                    scoreA += 10;
                    scoreADisplay.innerText = scoreA;
                } else {
                    scoreB += 10;
                    scoreBDisplay.innerText = scoreB;
                }
            } else {
                btnElement.classList.add("wrong");
                allBtns[correctIndex].classList.add("correct"); 
            }
            
            answerRevealed = true;
            
            for (let btn of allBtns) {
                btn.classList.add("disabled");
            }

            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }

        function showEndScreen() {
            statusArea.classList.add("hidden");
            gameArea.classList.add("hidden");
            endScreen.classList.remove("hidden");
            
            if (scoreA > scoreB) {
                winnerText.innerText = "🏆 Group A ජයග්‍රහණය කළා!";
                winnerText.style.color = "#2196F3";
            } else if (scoreB > scoreA) {
                winnerText.innerText = "🏆 Group B ජයග්‍රහණය කළා!";
                winnerText.style.color = "#f44336";
            } else {
                winnerText.innerText = "🤝 තරගය සමයි (Draw)!";
                winnerText.style.color = "#FF9800";
            }
        }
    </script>
</body>
</html>
